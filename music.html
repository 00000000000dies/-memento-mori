<style>
.music-page{min-height:100vh;padding:25px 7vw 60px}.music-wrap{width:min(900px,100%);margin:0 auto}.music-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.back{color:#666;text-decoration:none;font-size:9px;letter-spacing:.3em}.back:hover{color:#aaa}.music-hero{text-align:center;padding:11vh 0 7vh}.music-hero h1{font-size:clamp(50px,8vw,90px);margin:16px 0}.music-hero p{color:#555;font-size:10px;letter-spacing:.28em;text-transform:uppercase}.player{border:1px solid var(--line);background:rgba(10,10,10,.82);padding:30px;box-shadow:0 0 70px rgba(126,13,21,.06)}.now-label{font-size:8px;letter-spacing:.35em;color:#555}.now-title{font-family:UnifrakturCook,serif;font-size:30px;margin:12px 0 25px;min-height:38px}.controls{display:flex;align-items:center;gap:14px}.play{width:45px;height:45px;border:1px solid #383838;background:none;color:#ddd;cursor:pointer;font-size:15px}.play:hover{border-color:var(--red);color:#fff}.progress{flex:1;appearance:none;height:2px;background:#292929;cursor:pointer}.progress::-webkit-slider-thumb{appearance:none;width:9px;height:9px;border-radius:50%;background:#777}.time{color:#555;font-size:9px;min-width:85px;text-align:right}.volume{width:90px;appearance:none;height:2px;background:#292929}.volume::-webkit-slider-thumb{appearance:none;width:8px;height:8px;border-radius:50%;background:#777}.player-note{margin-top:18px;color:#444;font-size:8px;letter-spacing:.16em;text-transform:uppercase}.playlist-head{display:flex;justify-content:space-between;margin:45px 0 12px;color:#555;font-size:9px;letter-spacing:.3em}.playlist{border:1px solid var(--line)}.track{display:flex;gap:18px;align-items:center;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer;transition:.2s}.track:last-child{border-bottom:0}.track:hover,.track.active{background:rgba(126,13,21,.09)}.num{width:28px;color:#3f3f3f;font-size:9px}.track-name{color:#aaa;font-size:11px;line-height:1.6}.track.active .track-name{color:#ddd}.music-footer{text-align:center;margin-top:45px}.music-footer a{color:#555;text-decoration:none;font-size:9px;letter-spacing:.3em}.music-footer a:hover{color:#aaa}@media(max-width:600px){.music-page{padding:18px 5vw 40px}.player{padding:23px 18px}.controls{gap:9px}.volume{width:55px}.time{min-width:65px}.track{padding:13px 12px;gap:10px}.track-name{font-size:10px}}
</style>
</head>
<body>

<main class="music-page"><div class="music-wrap">

<section class="music-hero"><p>ARCHIVE / MUSIC / 001</p><h1>𝕸𝖚𝖘𝖎𝖈</h1><p>songs for things that never healed.</p></section>
<section class="player"><span class="now-label">BACKGROUND AUDIO</span><div id="nowTitle" class="now-title">Background Audio</div><div class="controls"><button id="playBtn" class="play">▶</button><input id="progress" class="progress" type="range" min="0" max="100" value="0"><span id="time" class="time">00:00 / 00:00</span><input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.65"></div><p class="player-note">audio file: background.mp3</p><audio id="audio" preload="metadata" loop src="background.mp3"></audio></section>

<script>
const songs=[
'Vanished — Crystal Castles','Wonder if you care — flyingfish','Insomnia — memo boy','Life imitates life — quannic','Help_urself — Ezekiel','Fantastic life — Cult Member','Cigarettes out the window — TV Girl','Knife Prty — Deftones','Bury Me Deep Inside Your Heart — HIM','505 — Arctic Monkeys','Starting over — LSD and the Search for god','SPIT IN MY FACE! — ThxSoMch','Suffocation — Crystal Castles','I’m so happy — EKKSTACY','High Enough — K.Flay','Missing Textures super slowed — NIVEK FFORHS','U weren’t Here I really miss you — Cult Member, Mia Martina','Minerva — Deftones','Say my name — suisside','うずまき — Machine Girl','Dreamcore — pathetic240 px','Scars — Novulent','Monolith — Twin Tribes','Dagger — Slowdive','Sextape — Deftones','Empathy — Crystal Castles','HRT — Girl Rituals','Please please please — Deftones','Sex, Drugs, etc — Beach Weather','You could be the one — Snow Strippers','I LOVE YOU HOE — Odetari','Nuts — Lil Peep','The perfect girl — Mareux','Join me in death — HIM','Crimewave — Crystal Castles','I want things to be beautiful — Devi McCallion','Why I love you — JAY-Z, Kanye West','When the sun hits — Slowdive','OMFG — Lil Peep','I wanna be yours — Arctic Monkeys','Pray for me — The Weeknd','Bathroom — Montell Fish','Avalon — $uicideboy$','Cry baby — The Neighbourhood','Exit Music — Radiohead','Change — Deftones','I don’t care — VIOLENT VIRA','Drown — Strange Boutique','Kill Yourself Part III — $uicideboy$','Where is my mind? — Pixies','Your face — Wisp','Digital Bath — Deftones','One — Metallica','Denial — Sevendust','Sad but true — Metallica','Drain you — Nirvana','Send the pain below — Chevelle','Psychosocial — Slipknot','Ghost girl — Lil Peep','Castles — Lil Peep','Pain — Lil Peep','KUCHUBURANKO — Plastic Tree','All I need — Radiohead','Hello Juliet — Clarion','My Own Summer — Deftones','Poster boy — 2hollis','Bitches brew — Crosses','Skin — otuka','Pretty Cvnt','Hope your too late i ready died','Sonne — Rammstein','With u — lucidbeatz','Headlock — Imogen Heap','August 10 — Julie Doiron','Blame — Montell Fish','I was only temporary?','iris — Pastel Ghost','How soon is now? — The Smiths','Dark beach — Pastel Ghost','One of The Girls — The Weeknd','Call out my name','Train food — XXXTENTACION','Cherry Waves — Deftones','Shadows — Pastel Ghost','Savior — Novulent','Don’t be so serious — Low Roar','Little Dark Age — MGMT','Do you wanna know?','Mg1 — Machine Girl','phantom bride — Deftones','Wonder if you care','Loves from the past — Mareux','Risk — Deftones','Memories — lead wave','Genesis — Deftones','Hotel — Montell Fish','West Coast — Lana Del Rey','No Surprises — Radiohead','Me and the birds — Duster','Rosemary — Deftones','Beware — Deftones','Twilight — boa','Untrust Us — Crystal Castles','Die for you','Embrace — Pastel Ghost','Kerosene — Crystal Castles','Save Me — XXXTENTACION','Dark side of the moon — suisside','U Said — Lil Peep','Awful Things — Lil Peep','Beamer Boy — Lil Peep','White Tee — Lil Peep','Falling Down — Lil Peep'
];
const playlist=document.getElementById('playlist'),audio=document.getElementById('audio'),playBtn=document.getElementById('playBtn'),progress=document.getElementById('progress'),volume=document.getElementById('volume'),nowTitle=document.getElementById('nowTitle'),time=document.getElementById('time');

songs.forEach((song,i)=>{
  const row=document.createElement('div');
  row.className='track';
  row.innerHTML='<span class="num">'+String(i+1).padStart(3,'0')+'</span><span class="track-name">'+song+'</span>';
  row.addEventListener('click',()=>{
    document.querySelectorAll('.track').forEach(x=>x.classList.remove('active'));
    row.classList.add('active');
  });
  playlist.appendChild(row);
});

function fmt(s){if(!Number.isFinite(s))return'00:00';return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
playBtn.onclick=()=>{if(audio.paused){audio.play().catch(()=>{});playBtn.textContent='Ⅱ'}else{audio.pause();playBtn.textContent='▶'}};
audio.addEventListener('timeupdate',()=>{progress.value=audio.duration?(audio.currentTime/audio.duration)*100:0;time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)});
progress.oninput=()=>{if(audio.duration)audio.currentTime=(progress.value/100)*audio.duration};
volume.oninput=()=>audio.volume=volume.value;audio.volume=.65;
audio.addEventListener('play',()=>playBtn.textContent='Ⅱ');
audio.addEventListener('pause',()=>playBtn.textContent='▶');
</script>
